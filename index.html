<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kviz</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(#ffe5e0, #ffc9c9);
      font-family: sans-serif;
      text-align: center;
    }
    #app { width: 90%; max-width: 360px; }
    h1 { color: #333; font-size: 24px; }
    button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 14px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      background: #d6336c;
      color: white;
    }
    button.alt {
  background: white;
  color: #333;
  transition: transform 0.3s;
}
.heart {
  position: fixed;
  bottom: -40px;
  pointer-events: none;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(40deg);
    opacity: 0;
  }
}

.ticket {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin: 20px 0;
  text-align: left;
  box-shadow: 0 10px 30px rgba(214, 51, 108, 0.25);
}

.ticket h2 {
  margin: 0 0 4px;
  color: #d6336c;
}

.ticket small {
  color: #999;
  letter-spacing: 1px;
}

.ticket hr {
  border: none;
  border-top: 2px dashed #eee;
  margin: 14px 0;
}

.row {
  display: flex;
  justify-content: space-between;
  margin: 8px 0;
}

.row span:first-child {
  color: #999;
  font-size: 13px;
}

.row span:last-child {
  font-weight: bold;
}

.gift {
  background: white;
  border: 2px dashed #d6336c;
  color: #d6336c;
  border-radius: 20px;
  padding: 18px;
  margin: 16px 0;
  font-size: 18px;
  cursor: pointer;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}

.letter {
  background: #fffaf5;
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 360px;
  max-height: 80vh;
  overflow-y: auto;
  text-align: left;
  line-height: 1.6;
  color: #333;
}

.letter h2 {
  color: #d6336c;
  margin-top: 0;
}

.letter .close {
  margin: 16px 0 0;
}
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const app = document.getElementById("app");

    const questions = [
      {
        text: "Hozir vaqtingiz bormi?",
        options: ["Hmm mayli🤔", "Sen uchun vaqt topaman", "Ha, albatta bor 💘"]
      },
      {
        text: "4-qavat oshxonasiga kelasizmi?",
        options: ["Mayli lekin yoqmayapti😏", "Bu nimadir qilmoqchi🤔", "Albatta! 🍽 "]
      },
      {
        text: "Meni yaxshi ko'rasizmi?",
        options: ["Balkim yaxshi ko'rarman", "Xa, sen hayotim mazmuniii", "Sevamanuuu💗"]
      }
    ];

    let current = 0;

    function showStart() {
      app.innerHTML = `
        <h1>Faqat to'g'ri javob bering!</h1>
        <button id="startBtn">Boshladik ✨</button>
      `;
      document.getElementById("startBtn").onclick = showQuestion;
    }

    function dodge(btn) {
  const x = Math.random() * 300 - 80;
  const y = Math.random() * 200 - 60;
  btn.style.transform = `translate(${x}px, ${y}px) rotate(${x / 10}deg)`;
}

    function showQuestion() {
      if (current >= questions.length) {
        showFinal();
        return;
      }

      const q = questions[current];
      app.innerHTML = `<h1>${q.text}</h1>`;

      q.options.forEach(function (text, index) {
  const btn = document.createElement("button");
  btn.textContent = text;

  if (index === 0) {
    btn.onclick = function () {
      current++;
      showQuestion();
    };
  } else {
    btn.className = "alt";
    btn.onmouseenter = function () { dodge(btn); };
    btn.ontouchstart = function (e) {
      e.preventDefault();
      dodge(btn);
    };
  }

  app.appendChild(btn);
});
    }

    function showFinal() {
  app.innerHTML = `
    <p style="color:#d6336c">to'g'ri javob berdingiz 💗</p>
    <h1>Hayotim bilan uchrashuv!</h1>

    <div class="ticket">
      <h2>Tug'ilgan kun✨</h2>
      <small>IKKI KISHILIK CHIPTA</small>
      <hr>
      <div class="row"><span>SEANS</span><span>4-qavat oshxonasida</span></div>
      <div class="row"><span>QACHON</span><span>Payshanba, 5-noyabr</span></div>
      <div class="row"><span>VAQT</span><span>01:00</span></div>
      <div class="row"><span>JOY</span><span>yonimda ❤️</span></div>
    </div>

    <p>Chiroyli kayfiyat ila keling 💞</p>

    <div class="gift" id="giftBox">🎁 Sizni yana bir narsa kutyapti... bosing!</div>
  `;

  document.getElementById("giftBox").onclick = openLetter;
}

function openLetter() {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="letter">
      <h2>Tugilgan kuningiz muborak, mening eng qadrli insonim! ❤️ 🎂</h2>
      <p>Sizni judayam judayam yaxshi ko'raman!</p>
      <p>Bilaman, hayot har doim ham biz istagandek kechmaydi. Ba'zan charchaysiz, ba'zan tushkunlikka tushasiz, ba'zan esa hech kimga aytolmaydigan o‘ylaringiz bo‘ladi. Shunday damlarda ham o‘zingizni yo‘qotmang. Siz o‘ylaganingizdan ham kuchliroqsiz va hali oldinda sizni kutayotgan juda ko‘p go‘zal kunlar bor.</p>
      <p>Sizni juda yaxshi ko'raman 💗</p>
      <p><b>Tug‘ilgan kuningiz muborak! Sizni juda qadrlayman. ❤️</b></p>
      <button class="close">Yopish</button>
    </div>
  `;

  overlay.querySelector(".close").onclick = function () {
    overlay.remove();
  };

  document.body.appendChild(overlay);
}

function spawnHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "💖";

  heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

setInterval(spawnHeart, 200);

    showStart();
  </script>
</body>
</html>
